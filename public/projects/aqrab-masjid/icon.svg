<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="am-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19866a"/>
      <stop offset="1" stop-color="#083f30"/>
    </linearGradient>
    <radialGradient id="am-sheen" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="am-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9efe6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#am-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#am-sheen)"/>

  <!-- map ring under the pin -->
  <ellipse cx="256" cy="418" rx="92" ry="22" fill="#000" fill-opacity="0.22"/>
  <ellipse cx="256" cy="412" rx="70" ry="14" fill="none" stroke="#f3f5f0" stroke-opacity="0.5" stroke-width="6"/>

  <!-- location pin, as in the app's own icon -->
  <path d="M256 404S118 280 118 190a138 138 0 1 1 276 0c0 90-138 214-138 214z" fill="url(#am-pin)"/>

  <!-- mosque inside the pin: dome, base, minarets, crescent -->
  <g fill="#0c5f47">
    <path d="M196 232v-26c0-33 24-55 60-82 36 27 60 49 60 82v26z"/>
    <rect x="186" y="232" width="140" height="24" rx="6"/>
    <rect x="166" y="170" width="16" height="86" rx="8"/>
    <rect x="330" y="170" width="16" height="86" rx="8"/>
    <circle cx="174" cy="160" r="10"/>
    <circle cx="338" cy="160" r="10"/>
  </g>
  <path d="M256 102a14 14 0 1 0 10 24 11 11 0 1 1-10-24z" fill="#0c5f47"/>
  <!-- door -->
  <path d="M242 256v-26a14 14 0 0 1 28 0v26z" fill="#f3f5f0"/>
</svg>
